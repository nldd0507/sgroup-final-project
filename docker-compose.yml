services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgroup
      POSTGRES_PASSWORD: sgroup
      POSTGRES_DB: sgroup_final_project
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgroup -d sgroup_final_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: